[package]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
categories = [
  "mathematics",
  "hardware-support",
  "no-std",
  "wasm",
  "external-ffi-bindings",
]
description = "Portable mixed-precision math, linear-algebra, & retrieval library with 2000+ SIMD kernels for x86, Arm, RISC-V, LoongArch, Power, & WebAssembly"
documentation = "https://docs.rs/numkong"
edition = "2021"
homepage = "https://ashvardanian.com/posts/numkong-faster-scipy"
include = ["rust/*.rs", "c/*.c", "c/*.h", "include/**/*.h", "probes/*.c", "build.rs"]
keywords = ["simd", "search", "linear-algebra", "vector"]
license = "Apache-2.0"
links = "numkong"
name = "numkong"
readme = "rust/README.md"
repository = "https://github.com/ashvardanian/NumKong"
rust-version = "1.73" # `usize::div_ceil` (used for sub-byte / block-scaled size math)
version = "7.7.1"

[lib]
name = "numkong"
path = "rust/numkong.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[build-dependencies]
cc = "1.2.36"

[profile.bench]
codegen-units = 1 # May increase compilation time but optimizes further
lto = true # Enables Link Time Optimization for further optimizations
opt-level = 3 # Corresponds to -O3
rpath = false # On some systems, setting this to false can help with optimizations

[features]
default = ["alloc"]
alloc = []
parallel = ["dep:forkunion", "std"]
std = ["alloc"]
wasm-runtime = []

[dependencies]
# The `Allocator` trait every owning container is generic over - the ecosystem's stable stand-in
# for the unstable `core::alloc::Allocator`. An arena, a pool, or a pinned-memory allocator
# written against it slots into `Tensor` and the packed containers with no adapter, and its
# `impl Allocator for &A` lets a non-`Clone` arena go in by reference. `default-features = false`
# takes the trait alone: the crate's `alloc` feature would add a `Box`/`Vec`/`RawVec`
# reimplementation an order of magnitude larger than the trait, only to supply a `Global` that
# this crate defines itself in a dozen lines - and that would force the `alloc` crate on the
# heapless targets `--no-default-features` exists to serve.
allocator-api2 = {version = "0.4", default-features = false}
forkunion = {version = "3.0", optional = true}

[dev-dependencies]
half = {version = "2.6.0"}
rand = {version = "0.10.0"}
wasmtime = {version = "44.0"}
wasmtime-wasi = {version = "44.0"}
