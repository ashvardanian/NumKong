name: Test Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test_go:
    name: Test Go
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Print Machine Specs
        run: |
          uname -a
          lscpu
          free -h

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the Library
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          cmake --preset release_shared
          cmake --build --preset release_shared --target numkong_static
          cp build_release_shared/libnumkong_static.a golang/

      - name: Test Go Bindings
        run: go test -v -count=1 ./golang/
