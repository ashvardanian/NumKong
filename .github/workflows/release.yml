name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

jobs:
  build_swift_artifacts:
    name: Build Swift Artifacts
    uses: ./.github/workflows/_swift.yml
    with:
      release: true

  # `Package.swift` names the Swift artifacts by URL and checksum, so the release commit carries both and the
  # artifacts join the release it creates.
  versioning:
    name: Update Version
    needs: build_swift_artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Swift Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: swift-{xcframework,artifactbundle}
          path: ${{ runner.temp }}/swift
          merge-multiple: true
      - name: Write Swift Checksums
        run: |
          apple=$(sha256sum "$RUNNER_TEMP"/swift/*.xcframework.zip | cut -c -64)
          portable=$(sha256sum "$RUNNER_TEMP"/swift/*.artifactbundle.zip | cut -c -64)
          sed -i "s/^let appleChecksum = .*/let appleChecksum = \"$apple\"/" Package.swift
          sed -i "s/^let portableChecksum = .*/let portableChecksum = \"$portable\"/" Package.swift
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            package.json:"(\d+\.\d+\.\d+)"
            javascript/@numkong-linux-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@numkong-linux-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@numkong-darwin-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@numkong-darwin-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@numkong-win32-x64/package.json:"version": "(\d+\.\d+\.\d+)"
            javascript/@numkong-win32-arm64/package.json:"version": "(\d+\.\d+\.\d+)"
            CITATION.cff:^version: (\d+\.\d+\.\d+)
            Package.swift:releases/download/v(\d+\.\d+\.\d+)
            package.json:@numkong/darwin-arm64": "(\d+\.\d+\.\d+)"
            package.json:@numkong/darwin-x64": "(\d+\.\d+\.\d+)"
            package.json:@numkong/linux-arm64": "(\d+\.\d+\.\d+)"
            package.json:@numkong/linux-x64": "(\d+\.\d+\.\d+)"
            package.json:@numkong/win32-arm64": "(\d+\.\d+\.\d+)"
            package.json:@numkong/win32-x64": "(\d+\.\d+\.\d+)"
          update-major-version-in: |
            include/numkong/types.h:^#define NUMKONG_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/numkong/types.h:^#define NUMKONG_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/numkong/types.h:^#define NUMKONG_VERSION_PATCH (\d+)
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      - name: Upload Swift Artifacts
        run: git diff --quiet HEAD~1 HEAD -- VERSION || gh release upload "v$(cat VERSION)" "$RUNNER_TEMP"/swift/*.zip

  rebase:
    name: Rebase Development Branch
    needs: versioning
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Checkout persists its credential as an `extraheader`, which the push below inherits and
          # which outranks the action's own `token`. Left unset, the force-push arrives as
          # `github-actions[bot]`, which holds no repository role to bypass the `main*` ruleset with.
          token: ${{ secrets.SEMANTIC_REBASE_TOKEN }}
      - name: Perform Rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main-dev
          git rebase origin/main
      - name: Push Changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_REBASE_TOKEN }}
          branch: main-dev
          unprotect_reviews: True
          force: True
