name: Release C

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  EMSCRIPTEN_VERSION: 6.0.9
  WASI_SDK_VERSION: "34"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  create_linux_deb_package:
    name: Create Debian Package for ${{ matrix.arch }} ${{ matrix.target }}
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang-20
      CXX: clang++-20
      AR: llvm-ar-20
      NM: llvm-nm-20
      RANLIB: llvm-ranlib-20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-gnu
          - arch: arm64
            target: aarch64-linux-gnu
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 make crossbuild-essential-arm64
      - name: Build Shared Library
        run: |
          cmake --preset release_shared \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld-20" \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}
          cmake --build --preset release_shared
          cp build_release_shared/libnumkong_shared.so \
            "numkong_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.so"
      - name: Package Debian Archive
        run: |
          DEB_DIR="numkong_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/local/lib"
          mkdir -p "${DEB_DIR}/usr/local/include/numkong"
          mkdir -p "${DEB_DIR}/usr/local/share/doc/numkong"
          cp build_release_shared/libnumkong_shared.so build_release_shared/libnumkong_static.a "${DEB_DIR}/usr/local/lib/"
          cp -r c/numkong/* include/numkong/* cpp/numkong/* "${DEB_DIR}/usr/local/include/numkong/"
          cp LICENSE "${DEB_DIR}/usr/local/share/doc/numkong/"
          cat > "${DEB_DIR}/DEBIAN/control" <<CTRL
          Package: numkong
          Version: ${{ steps.set_version.outputs.version }}
          Maintainer: Ash Vardanian
          Architecture: ${{ matrix.arch }}
          Description: Portable SIMD-Accelerated Algebra for Vectors, Matrices, and Tensors
          CTRL
          sed -i 's/^          //' "${DEB_DIR}/DEBIAN/control"
          dpkg-deb --build "${DEB_DIR}"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so *.deb --clobber

  create_windows_dll_library:
    name: Create Library for Windows ${{ matrix.arch }} with ${{ matrix.preset }}
    needs: hooks
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, preset: msvc2026_x64 }
          - { arch: arm64, preset: msvc2022_arm64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up MSVC
        uses: microsoft/setup-msbuild@v3
      # Newest CMake, so it knows whichever Visual Studio the image ships.
      - name: Set Up CMake
        uses: lukka/get-cmake@latest
      - name: Get Version
        id: set_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build Shared Library
        run: |
          cmake --preset ${{ matrix.preset }} -D NUMKONG_BUILD_TEST=OFF
          cmake --build --preset ${{ matrix.preset }}
      # MSVC links a DLL through its import library, so the archive carries both.
      - name: Package Archive
        shell: bash
        run: |
          tar -czf "numkong_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar.gz" \
            build_${{ matrix.preset }}/Release/numkong_shared.dll \
            build_${{ matrix.preset }}/Release/numkong_shared.lib \
            build_${{ matrix.preset }}/Release/numkong_static.lib \
            c/numkong/ include/numkong/ cpp/numkong/ \
            LICENSE
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} "numkong_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar.gz" --clobber

  create_macos_dylib_library:
    name: Create Library for macOS ${{ matrix.arch }}
    needs: hooks
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build Shared Library
        run: |
          cmake --preset release_shared -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build --preset release_shared
          cp build_release_shared/libnumkong_shared.dylib \
            "numkong_macos_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.dylib"
          zip -r "numkong_macos_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.zip" \
            build_release_shared/libnumkong_shared.dylib build_release_shared/libnumkong_static.a c/numkong/ include/numkong/ cpp/numkong/ LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.dylib *.zip --clobber

  create_android_library:
    name: Create Library for Android ${{ matrix.arch }} with ${{ matrix.preset }}
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: android_armv7
            arch: arm32
          - preset: android_arm64
            arch: arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      # The toolchain files take API level 28 and the NDK's default static libc++
      - name: Build Shared Library
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
      - name: Package Archive
        run: |
          zip -r "numkong_android_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.zip" \
            build_${{ matrix.preset }}/libnumkong_shared.so c/numkong/ include/numkong/ cpp/numkong/ LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.zip --clobber

  # One module per tier and width; the loader picks a wasm32 tier by what the engine validates.
  build_wasm_module:
    name: Build WASM Module ${{ matrix.width }} ${{ matrix.simd }}
    needs: hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: wasm32
            simd: serial
          - width: wasm32
            simd: v128
          - width: wasm32
            simd: v128relaxed
          - width: wasm64
            simd: v128relaxed
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Emscripten
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 180
          command: |
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            (cd ~/emsdk && ./emsdk install "$EMSCRIPTEN_VERSION" && ./emsdk activate "$EMSCRIPTEN_VERSION")
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build WASM
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --preset ${{ matrix.width }}_emscripten -B build_wasm -D NUMKONG_MARCH=${{ matrix.simd }}
          cmake --build build_wasm
      # The wasm64 linker flags can produce a module that links but fails to instantiate.
      - name: Smoke Test WASM64 Module
        if: matrix.width == 'wasm64'
        run: |
          node -e "
            import('./build_wasm/numkong-wasm64-${{ matrix.simd }}.js')
              .then(m => m.default())
              .then(M => {
                const out = M._malloc(8);
                M._nk_cpu_capabilities_enabled(BigInt(out));
                console.log('capabilities:', new BigUint64Array(M.wasmMemory.buffer, out, 1)[0]);
              })"
      - name: Upload WASM Module
        uses: actions/upload-artifact@v7
        with:
          name: wasm-module-${{ matrix.width }}-${{ matrix.simd }}
          path: |
            build_wasm/numkong-${{ matrix.width }}-${{ matrix.simd }}.js
            build_wasm/numkong-${{ matrix.width }}-${{ matrix.simd }}.wasm
          if-no-files-found: error
          retention-days: 1

  create_wasm_library:
    name: Create WASM Library
    needs: build_wasm_module
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download WASM Modules
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-module-*
          path: wasm
          merge-multiple: true
      - name: Build Browser Bundle
        run: |
          npm install --ignore-scripts
          npm run build-js
          npm run build-browser
          cp LICENSE wasm/
      # The entries import each module by package subpath, which a page without a bundler maps itself.
      - name: Package WASM Release
        run: |
          cd wasm
          tar -czf "../numkong_wasm_${{ steps.set_version.outputs.version }}.tar.gz" \
            numkong.js numkong-extended.js numkong-wasm32-*.js numkong-wasm32-*.wasm numkong-wasm64-*.js numkong-wasm64-*.wasm LICENSE
          zip -r "../numkong_wasm_${{ steps.set_version.outputs.version }}.zip" \
            numkong.js numkong-extended.js numkong-wasm32-*.js numkong-wasm32-*.wasm numkong-wasm64-*.js numkong-wasm64-*.wasm LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} numkong_wasm_*.tar.gz numkong_wasm_*.zip --clobber

  # The static archive and headers for C and Rust callers that link their own WASI module.
  create_wasi_library:
    name: Create Library for ${{ matrix.os }} wasm32 ${{ matrix.simd }} with ${{ matrix.preset }}
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: wasi
            preset: wasm32_wasi
            simd: v128
          - os: wasi
            preset: wasm32_wasi
            simd: v128relaxed
          - os: wasi-threads
            preset: wasm32_wasi_threads
            simd: v128relaxed
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install WASI-SDK
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 180
          command: |
            wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
            tar xzf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz -C ~
            mv ~/wasi-sdk-* ~/wasi-sdk
      - name: Build Static Library
        run: |
          cmake --preset ${{ matrix.preset }} -D NUMKONG_MARCH=${{ matrix.simd }}
          cmake --build --preset ${{ matrix.preset }} --target numkong_static
      - name: Package Archive
        run: |
          zip -r "numkong_${{ matrix.os }}_wasm32-${{ matrix.simd }}_${{ steps.set_version.outputs.version }}.zip" \
            build_${{ matrix.preset }}/libnumkong_static.a c/numkong/ include/numkong/ cpp/numkong/ LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.zip --clobber

  create_freebsd_library:
    name: Create Library for FreeBSD ${{ matrix.arch }} ${{ matrix.processor }} ${{ matrix.freebsd_arch }}
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CC: clang-20
      CXX: clang++-20
      AR: llvm-ar-20
      NM: llvm-nm-20
      RANLIB: llvm-ranlib-20
      # Sysroot and triple share one release; upstream retires EOL trees.
      FREEBSD_RELEASE: "14.4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            freebsd_arch: amd64
            processor: x86_64
          - arch: arm64
            freebsd_arch: arm64/aarch64
            processor: aarch64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20
      - name: Download FreeBSD Sysroot
        run: |
          mkdir -p /tmp/freebsd-sysroot
          curl -fsSL "https://download.freebsd.org/releases/${{ matrix.freebsd_arch }}/${{ env.FREEBSD_RELEASE }}-RELEASE/base.txz" \
            | tar -xJf - -C /tmp/freebsd-sysroot ./lib ./usr/lib ./usr/include
      - name: Build Shared Library
        run: |
          cmake --preset release_shared \
            -D CMAKE_SYSTEM_NAME=FreeBSD \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -D CMAKE_SYSROOT=/tmp/freebsd-sysroot \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.processor }}-unknown-freebsd${{ env.FREEBSD_RELEASE }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.processor }}-unknown-freebsd${{ env.FREEBSD_RELEASE }} \
            -D CMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld-20"
          cmake --build --preset release_shared
          cp build_release_shared/libnumkong_shared.so \
            "numkong_freebsd_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.so"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so --clobber

  create_linux_exotic_library:
    name: Create Library for Linux ${{ matrix.name }}
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ppc64le
            arch: ppc64le
            cc: powerpc64le-linux-gnu-gcc-15
            cxx: powerpc64le-linux-gnu-g++-15
            pkg: gcc-15-powerpc64le-linux-gnu g++-15-powerpc64le-linux-gnu
            processor: ppc64le
          - name: loongarch64
            arch: loongarch64
            cc: loongarch64-linux-gnu-gcc-15
            cxx: loongarch64-linux-gnu-g++-15
            pkg: gcc-15-loongarch64-linux-gnu g++-15-loongarch64-linux-gnu
            processor: loongarch64
          - name: s390x
            arch: s390x
            cc: s390x-linux-gnu-gcc-15
            cxx: s390x-linux-gnu-g++-15
            pkg: gcc-15-s390x-linux-gnu g++-15-s390x-linux-gnu
            processor: s390x
          - name: armv7l
            arch: armv7l
            cc: arm-linux-gnueabihf-gcc-15
            cxx: arm-linux-gnueabihf-g++-15
            pkg: gcc-15-arm-linux-gnueabihf g++-15-arm-linux-gnueabihf
            processor: arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}
      - name: Build Shared Library
        run: |
          cmake --preset release_shared \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -D CMAKE_C_COMPILER=${{ matrix.cc }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -D CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          cmake --build --preset release_shared
          cp build_release_shared/libnumkong_shared.so \
            "numkong_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.so"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so --clobber

  create_linux_riscv_library:
    name: Create Library for Linux RISC-V
    needs: hooks
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y cmake clang-23 lld-23 llvm-23 \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
      - name: Build Shared Library
        run: |
          cmake --preset linux_riscv64_llvm -D LLVM_ROOT=/usr/lib/llvm-23 -D NUMKONG_BUILD_TEST=OFF
          cmake --build --preset linux_riscv64_llvm
          cp build_linux_riscv64_llvm/libnumkong_shared.so \
            "numkong_linux_riscv64_${{ steps.set_version.outputs.version }}.so"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so --clobber
