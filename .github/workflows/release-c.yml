name: Release C

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  EMSCRIPTEN_VERSION: 6.0.9
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create_linux_deb_package:
    name: Create Debian Package
    runs-on: ubuntu-24.04
    env:
      CC: clang-20
      CXX: clang++-20
      AR: llvm-ar-20
      NM: llvm-nm-20
      RANLIB: llvm-ranlib-20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux-gnu
          - arch: arm64
            target: aarch64-linux-gnu
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 make crossbuild-essential-arm64
      - name: Build Shared Library
        run: |
          cmake --preset release_shared \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -D CMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld-20" \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}
          cmake --build --preset release_shared
          cp build_release_shared/libnumkong.so \
            "numkong_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.so"
      - name: Package Debian Archive
        run: |
          DEB_DIR="numkong_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/local/lib"
          mkdir -p "${DEB_DIR}/usr/local/include/numkong"
          mkdir -p "${DEB_DIR}/usr/local/share/doc/numkong"
          cp build_release_shared/libnumkong.so "${DEB_DIR}/usr/local/lib/"
          cp -r include/numkong/* "${DEB_DIR}/usr/local/include/numkong/"
          cp LICENSE "${DEB_DIR}/usr/local/share/doc/numkong/"
          cat > "${DEB_DIR}/DEBIAN/control" <<CTRL
          Package: numkong
          Version: ${{ steps.set_version.outputs.version }}
          Maintainer: Ash Vardanian
          Architecture: ${{ matrix.arch }}
          Description: Portable SIMD-Accelerated Algebra for Vectors, Matrices, and Tensors
          CTRL
          sed -i 's/^          //' "${DEB_DIR}/DEBIAN/control"
          dpkg-deb --build "${DEB_DIR}"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so *.deb --clobber

  create_windows_dll_library:
    name: Create Library for Windows
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: arm64
            cmake_arch: ARM64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Set Up MSVC
        uses: microsoft/setup-msbuild@v3
      # Newest CMake, so it knows whichever Visual Studio the image ships.
      - name: Set Up CMake
        uses: lukka/get-cmake@latest
      - name: Get Version
        id: set_version
        shell: bash
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      # No `-G`: let CMake pick the installed Visual Studio.
      - name: Build Shared Library
        run: |
          cmake -A ${{ matrix.cmake_arch }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DNUMKONG_BUILD_SHARED=ON `
            -DNUMKONG_BUILD_TEST=OFF `
            -DNUMKONG_BUILD_BENCH=OFF `
            -B build_release
          cmake --build build_release --config Release
      - name: Package Archive
        shell: bash
        run: |
          tar -czf "numkong_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar.gz" \
            build_release/Release/numkong.dll \
            include/numkong/ \
            LICENSE
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} "numkong_windows_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.tar.gz" --clobber

  create_macos_dylib_library:
    name: Create Library for macOS, ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build Shared Library
        run: |
          cmake --preset release_shared -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build --preset release_shared
          cp build_release_shared/libnumkong.dylib \
            "numkong_macos_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.dylib"
          zip -r "numkong_macos_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.zip" \
            build_release_shared/libnumkong.dylib include/numkong/ LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} *.dylib *.zip --clobber

  create_android_library:
    name: Create Android Library
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: android_armv7
            arch: arm32
          - preset: android_arm64
            arch: arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      # The toolchain files take API level 28 and the NDK's default static libc++
      - name: Build Shared Library
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
      - name: Package Archive
        run: |
          zip -r "numkong_android_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.zip" \
            build_${{ matrix.preset }}/libnumkong.so include/numkong/ LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} *.zip --clobber

  # One module per tier and width; the loader picks a wasm32 tier by what the engine validates.
  build_wasm_module:
    name: Build WASM Module, ${{ matrix.width }} ${{ matrix.simd }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: wasm32
            simd: v128
          - width: wasm32
            simd: v128relaxed
          - width: wasm64
            simd: v128relaxed
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Install Emscripten
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 180
          command: |
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            (cd ~/emsdk && ./emsdk install "$EMSCRIPTEN_VERSION" && ./emsdk activate "$EMSCRIPTEN_VERSION")
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build WASM
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --preset ${{ matrix.width }}_emscripten -B build_wasm -D NUMKONG_WASM_SIMD=${{ matrix.simd }}
          cmake --build build_wasm
      # The wasm64 linker flags can produce a module that links but fails to instantiate.
      - name: Smoke Test WASM64 Module
        if: matrix.width == 'wasm64'
        run: |
          node --experimental-wasm-memory64 -e "
            import('./build_wasm/numkong-wasm64-${{ matrix.simd }}.js')
              .then(m => m.default())
              .then(M => console.log('capabilities:', M._nk_capabilities_available()))"
      - name: Upload WASM Module
        uses: actions/upload-artifact@v7
        with:
          name: wasm-module-${{ matrix.width }}-${{ matrix.simd }}
          path: |
            build_wasm/numkong-${{ matrix.width }}-${{ matrix.simd }}.js
            build_wasm/numkong-${{ matrix.width }}-${{ matrix.simd }}.wasm
          if-no-files-found: error
          retention-days: 1

  create_wasm_library:
    name: Create WASM Library
    needs: build_wasm_module
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download WASM Modules
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-module-*
          path: wasm
          merge-multiple: true
      - name: Build Browser Bundle
        run: |
          npm install --ignore-scripts
          npm run build-js
          npx esbuild javascript/dist/esm/numkong-browser.js \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile=wasm/numkong.js
          cp javascript/dist/esm/numkong-browser.d.ts wasm/numkong.d.ts
          cp LICENSE wasm/
      - name: Package WASM Release
        run: |
          cd wasm
          tar -czf "../numkong_wasm_${{ steps.set_version.outputs.version }}.tar.gz" \
            numkong.js numkong.d.ts numkong-wasm32-*.js numkong-wasm32-*.wasm numkong-wasm64-*.js numkong-wasm64-*.wasm LICENSE
          zip -r "../numkong_wasm_${{ steps.set_version.outputs.version }}.zip" \
            numkong.js numkong.d.ts numkong-wasm32-*.js numkong-wasm32-*.wasm numkong-wasm64-*.js numkong-wasm64-*.wasm LICENSE
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} numkong_wasm_*.tar.gz numkong_wasm_*.zip --clobber

  create_freebsd_library:
    name: Create Library for FreeBSD
    runs-on: ubuntu-24.04
    env:
      CC: clang-20
      CXX: clang++-20
      AR: llvm-ar-20
      NM: llvm-nm-20
      RANLIB: llvm-ranlib-20
      # Sysroot and triple share one release; upstream retires EOL trees.
      FREEBSD_RELEASE: "14.4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            freebsd_arch: amd64
            processor: x86_64
          - arch: arm64
            freebsd_arch: arm64/aarch64
            processor: aarch64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20
      - name: Download FreeBSD Sysroot
        run: |
          mkdir -p /tmp/freebsd-sysroot
          curl -fsSL "https://download.freebsd.org/releases/${{ matrix.freebsd_arch }}/${{ env.FREEBSD_RELEASE }}-RELEASE/base.txz" \
            | tar -xJf - -C /tmp/freebsd-sysroot ./lib ./usr/lib ./usr/include
      - name: Build Shared Library
        run: |
          cmake --preset release_shared \
            -D CMAKE_SYSTEM_NAME=FreeBSD \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -D CMAKE_SYSROOT=/tmp/freebsd-sysroot \
            -D CMAKE_C_COMPILER_TARGET=${{ matrix.processor }}-unknown-freebsd${{ env.FREEBSD_RELEASE }} \
            -D CMAKE_CXX_COMPILER_TARGET=${{ matrix.processor }}-unknown-freebsd${{ env.FREEBSD_RELEASE }} \
            -D CMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld-20"
          cmake --build --preset release_shared
          cp build_release_shared/libnumkong.so \
            "numkong_freebsd_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.so"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so --clobber

  create_linux_exotic_library:
    name: Create Library for Linux, ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ppc64le
            arch: ppc64le
            cc: powerpc64le-linux-gnu-gcc-14
            cxx: powerpc64le-linux-gnu-g++-14
            pkg: gcc-14-powerpc64le-linux-gnu g++-14-powerpc64le-linux-gnu
            processor: ppc64le
          - name: loongarch64
            arch: loongarch64
            cc: loongarch64-linux-gnu-gcc-14
            cxx: loongarch64-linux-gnu-g++-14
            pkg: gcc-14-loongarch64-linux-gnu g++-14-loongarch64-linux-gnu
            processor: loongarch64
          - name: s390x
            arch: s390x
            cc: s390x-linux-gnu-gcc-14
            cxx: s390x-linux-gnu-g++-14
            pkg: gcc-14-s390x-linux-gnu g++-14-s390x-linux-gnu
            processor: s390x
          - name: armv7l
            arch: armv7l
            cc: arm-linux-gnueabihf-gcc-14
            cxx: arm-linux-gnueabihf-g++-14
            pkg: gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf
            processor: arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}
      - name: Build Shared Library
        run: |
          cmake --preset release_shared \
            -D CMAKE_SYSTEM_NAME=Linux \
            -D CMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }} \
            -D CMAKE_C_COMPILER=${{ matrix.cc }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -D CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          cmake --build --preset release_shared
          cp build_release_shared/libnumkong.so \
            "numkong_linux_${{ matrix.arch }}_${{ steps.set_version.outputs.version }}.so"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so --clobber

  create_linux_riscv_library:
    name: Create Library for Linux RISC-V
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Get Version
        id: set_version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Install Dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y cmake clang-23 lld-23 llvm-23 \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
      - name: Build Shared Library
        run: |
          cmake --preset linux_riscv64_llvm -D LLVM_ROOT=/usr/lib/llvm-23 -D RISCV_MARCH=rv64gcv_zvfh_zvfbfwma_zvbb \
            -D NUMKONG_BUILD_TEST=OFF
          cmake --build --preset linux_riscv64_llvm
          cp build_linux_riscv64_llvm/libnumkong.so \
            "numkong_linux_riscv64_${{ steps.set_version.outputs.version }}.so"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} *.so --clobber
