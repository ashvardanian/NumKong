name: Test Rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Only `cuda` and `rocm` change the C library, so every host build links one CMake build of it.
  test_rust:
    name: Test Rust
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      NUMKONG_LIBRARY_DIR: ${{ github.workspace }}/build_release_shared

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Print Machine Specs
        run: |
          uname -a
          lscpu
          free -h

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Build C Library
        run: |
          cmake --preset release_shared
          cmake --build --preset release_shared --target numkong_static

      - name: Test Default Build
        run: cargo test

      - name: Test with All CPU Features
        run: cargo test --features parallel

      - name: Test with Std Feature
        run: cargo test --features std

      - name: Check No-Alloc Build
        run: cargo check --no-default-features

      - name: Check Alloc-without-Std Build
        run: cargo check --no-default-features --features alloc

  # 32-bit ARM catches AArch64-only intrinsics leaking into NEON paths.
  build_rust_cross:
    name: Build Rust for ${{ matrix.target }} with ${{ matrix.features }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [i686-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
        features: ["--features std", "--no-default-features"]
        include:
          - target: i686-unknown-linux-gnu
            packages: gcc-multilib g++-multilib libc6-dev-i386
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf
    env:
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc-14
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++-14
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Install Cross-Compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Build Library
        run: cargo build --target ${{ matrix.target }} ${{ matrix.features }}

  lint_rust:
    name: Lint Rust
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - name: Run Clippy with All CPU Features
        run: cargo clippy --features parallel -- -D warnings
      - name: Rustfmt Check
        run: cargo fmt --all --check

  build_rust_msrv:
    name: Build Rust via MSRV 1.100
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      # Until 1.100 reaches stable, nightly stands in, and `rust-version` rejects any older compiler.
      - name: Install Rust 1.100
        uses: dtolnay/rust-toolchain@nightly
      - name: Build with Default Features
        run: cargo build
      - name: Build No-Alloc
        run: cargo build --no-default-features

  # Each Rust WASI target builds through its own CMake toolchain, with the capability its target features declare.
  build_rust_wasi:
    name: Build Rust for ${{ matrix.target }} with ${{ matrix.features }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip1
            features: +simd128
          - target: wasm32-wasip1
            features: +relaxed-simd
          - target: wasm32-wasip1-threads
            features: +relaxed-simd
    env:
      WASI_SDK_VERSION: "34"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Install WASI SDK
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz
            tar xzf wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz -C ~
            mv ~/wasi-sdk-* ~/wasi-sdk
      - name: Build Library
        run: cargo build --target ${{ matrix.target }} --features std
        env:
          RUSTFLAGS: -C target-feature=${{ matrix.features }}

  # No hosted runner has a GPU, so the `cuda` and `rocm` features, which build through CMake, are link checks.
  build_rust_cuda:
    name: Build Rust with CUDA
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    steps:
      - name: Install Dependencies
        run: apt-get update && apt-get install -y cmake make g++ git curl
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Link Tests with CUDA
        run: cargo test --features cuda --no-run

  build_rust_rocm:
    name: Build Rust with ROCm
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: rocm/dev-ubuntu-26.04:10.0.0-full
    steps:
      - name: Install Dependencies
        run: apt-get update && apt-get install -y cmake make git curl
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Link Tests with ROCm
        run: cargo test --features rocm --no-run
