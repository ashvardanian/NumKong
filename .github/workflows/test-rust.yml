name: Test Rust

on:
  pull_request:
    branches: ["main", "main-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_rust:
    name: Test Rust
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Machine Specs
        shell: bash
        run: |
          echo "::group::Machine Information"
          uname -a || true
          cat /proc/cpuinfo 2>/dev/null | head -30 || sysctl -a machdep.cpu 2>/dev/null | head -30 || wmic cpu get Name,NumberOfCores,MaxClockSpeed 2>/dev/null || true
          free -h 2>/dev/null || vm_stat 2>/dev/null || systeminfo 2>/dev/null | head -20 || true
          echo "::endgroup::"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Cross-Compilation Targets and Dependencies
        run: |
          rustup target add i686-unknown-linux-gnu
          rustup target add armv7-unknown-linux-gnueabihf
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # Install i686 multilib and ARM cross-compiler separately to avoid
          # gcc-multilib vs gcc-arm-linux-gnueabihf package conflicts.
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
          sudo apt-get install -y gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf

      - name: Test Default Build
        run: cargo test

      - name: Test with All CPU Features
        run: cargo test --features parallel

      - name: Test with Std Feature
        run: cargo test --features std

      - name: Check No-Alloc Build
        run: cargo check --no-default-features

      - name: Check Alloc-without-Std Build
        run: cargo check --no-default-features --features alloc

      - name: Test i686 Cross-Compilation Build
        run: cargo build --target i686-unknown-linux-gnu --features std

      - name: Cross-Compile No-Std for i686
        run: cargo build --target i686-unknown-linux-gnu --no-default-features

      # 32-bit ARM — catches AArch64-only intrinsics leaking into NEON paths
      - name: Test ARMv7 Cross-Compilation Build
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc-14
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++-14
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc-14
        run: cargo build --target armv7-unknown-linux-gnueabihf --features std

      - name: Cross-Compile No-Std for ARMv7
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc-14
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++-14
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc-14
        run: cargo build --target armv7-unknown-linux-gnueabihf --no-default-features

  lint:
    name: Lint Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - name: Run Clippy with All CPU Features
        run: cargo clippy --features parallel -- -D warnings
      - name: Rustfmt Check
        run: cargo fmt --all --check

  msrv:
    name: Build Rust via MSRV 1.100
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Until 1.100 reaches stable, nightly stands in, and `rust-version` rejects any older compiler.
      - name: Install Rust 1.100
        uses: dtolnay/rust-toolchain@nightly
      - name: Build with Default Features
        run: cargo build
      - name: Build No-Alloc
        run: cargo build --no-default-features

  # Each Rust WASI target builds through its own CMake toolchain, with the capability its target features declare.
  build_wasi:
    name: Build Rust for ${{ matrix.target }} with ${{ matrix.features }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip1
            features: +simd128
          - target: wasm32-wasip1
            features: +relaxed-simd
          - target: wasm32-wasip1-threads
            features: +relaxed-simd
    env:
      WASI_SDK_VERSION: "34"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Install WASI SDK
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz
            tar xzf wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz -C ~
            mv ~/wasi-sdk-* ~/wasi-sdk
      - name: Build Library
        run: cargo build --target ${{ matrix.target }} --features std
        env:
          RUSTFLAGS: -C target-feature=${{ matrix.features }}

  # No hosted runner has a GPU, so the `cuda` and `rocm` features, which build through CMake, are link checks.
  build_cuda:
    name: Build Rust with CUDA
    runs-on: ubuntu-26.04
    # NVIDIA publishes no Ubuntu 26.04 CUDA image yet, so the toolkit comes in a 24.04 container.
    container: nvidia/cuda:13.0.1-devel-ubuntu24.04
    steps:
      - name: Install Dependencies
        run: apt-get update && apt-get install -y cmake make g++ git curl
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Link Tests with CUDA
        run: cargo test --features cuda --no-run

  build_rocm:
    name: Build Rust with ROCm
    runs-on: ubuntu-26.04
    container: rocm/dev-ubuntu-26.04:latest
    steps:
      - name: Install Dependencies
        run: apt-get update && apt-get install -y cmake make git curl
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Link Tests with ROCm
        run: cargo test --features rocm --no-run
