name: Test C

on:
  pull_request:
    branches: ["main", "main-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_c:
    name: Test C on Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Machine Specs
        shell: bash
        run: |
          echo "::group::Machine Information"
          uname -a || true
          cat /proc/cpuinfo 2>/dev/null | head -30 || sysctl -a machdep.cpu 2>/dev/null | head -30 || wmic cpu get Name,NumberOfCores,MaxClockSpeed 2>/dev/null || true
          free -h 2>/dev/null || vm_stat 2>/dev/null || systeminfo 2>/dev/null | head -20 || true
          echo "::endgroup::"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-14 g++-14 libjemalloc-dev libomp-dev libopenblas-dev

      - name: Build Locally
        run: |
          cmake -D CMAKE_BUILD_TYPE=Release -D NK_BUILD_TEST=1 -D NK_BUILD_BENCH=1 -D NK_COMPARE_TO_BLAS=ON \
            -D CMAKE_C_COMPILER=gcc-14 -D CMAKE_CXX_COMPILER=g++-14 -B build_release
          cmake --build build_release --config Release

      - name: Test
        run: build_release/nk_test
        env:
          NK_BUDGET_SECS: 0.2

      - name: Build Shared Library Test
        run: |
          cmake -D CMAKE_BUILD_TYPE=Release -D NK_BUILD_SHARED=1 -D NK_BUILD_SHARED_TEST=1 \
            -D CMAKE_C_COMPILER=gcc-14 -D CMAKE_CXX_COMPILER=g++-14 -B build_shared
          cmake --build build_shared --config Release --target nk_shared_test

      - name: Test Shared Library
        run: LD_LIBRARY_PATH=build_shared build_shared/nk_shared_test

  test_macos_homebrew_llvm:
    name: Test macOS Homebrew LLVM
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Homebrew LLVM
        run: brew install llvm

      # Record everything the runner CPU advertises so a future probe
      # mismatch can be diagnosed without repro-locally-only guesswork.
      - name: Print Machine Specs
        run: sysctl hw.optional.arm || true

      - name: Build
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -B build_brew_llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++" \
            -DNK_BUILD_TEST=1 \
            -DNK_BUILD_SHARED=1
          cmake --build build_brew_llvm --config Release

      # Smoke test under lldb with an impossible NK_FILTER so no kernels run —
      # only `nk_capabilities()` / `nk_configure_thread()` and the suite's
      # argv/env setup. If a SIGILL fires during probing (as on Apple M1 with
      # Homebrew LLVM), lldb captures the backtrace, faulting PC symbol, and
      # 8 instructions around it so the offender is visible in the job log.
      - name: Smoke test under lldb (probing only)
        run: |
          DYLD_LIBRARY_PATH=build_brew_llvm \
            lldb --batch \
              -o run \
              -k 'bt all' \
              -k 'image lookup -a {frame.pc}' \
              -k 'disassemble -c 8 -s {frame.pc}' \
              -k 'quit' \
              -- build_brew_llvm/nk_test
        env:
          NK_FILTER: __nk_impossible_filter__
          NK_BUDGET_SECS: 0.05

      - name: Test
        run: DYLD_LIBRARY_PATH=build_brew_llvm build_brew_llvm/nk_test
        env:
          NK_BUDGET_SECS: 0.2

  test_windows:
    name: Test C on Windows
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Machine Specs
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors,Description,Architecture
          Get-ComputerInfo | Format-List CsProcessors,OsArchitecture,WindowsVersion

      - name: Set Up MSVC
        uses: microsoft/setup-msbuild@v3

      # Newest CMake, so it knows whichever Visual Studio the image ships.
      - name: Set Up CMake
        uses: lukka/get-cmake@latest

      # No `-G`: let CMake pick the installed Visual Studio.
      - name: Build
        run: |
          cmake -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DNK_BUILD_TEST=ON `
            -DNK_BUILD_BENCH=OFF `
            -B build_release
          cmake --build build_release --config Release

      - name: Test
        run: build_release\Release\nk_test.exe
        env:
          NK_BUDGET_SECS: 0.2

      - name: Build Shared Library Test
        run: |
          cmake -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DNK_BUILD_SHARED=ON `
            -DNK_BUILD_SHARED_TEST=ON `
            -B build_shared
          cmake --build build_shared --config Release --target nk_shared_test

      - name: Test Shared Library
        shell: cmd # PowerShell normalizes structured-exception exit codes to 1; cmd preserves the real code
        run: build_shared\Release\nk_shared_test.exe
        env:
          NK_BUDGET_SECS: 0.2

  test_android:
    name: Test Android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Machine Specs
        shell: bash
        run: |
          echo "::group::Machine Information"
          uname -a || true
          cat /proc/cpuinfo 2>/dev/null | head -30 || true
          free -h 2>/dev/null || true
          echo "::endgroup::"

      - name: Download Android NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip -d ~/
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build via CMake
        run: |
          cmake -B build_android \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-android-arm64.cmake \
            -DNK_BUILD_SHARED=ON
          cmake --build build_android

      - name: Verify Binary
        run: |
          file build_android/libnumkong.so
          file build_android/libnumkong.so | grep -q "ELF 64-bit.*aarch64"
          readelf -d build_android/libnumkong.so | head -20

      - name: Install Rust Toolchain
        uses: moonrepo/setup-rust@v1

      - name: Install cargo-ndk and Target
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: Build via Cargo
        run: cargo ndk -t arm64-v8a build --release

  # 32-bit ARM Android — catches AArch64-only intrinsics leaking into
  # NEON code paths, like float64x2_t which doesn't exist on ARMv7.
  test_android_armv7:
    name: Test Android ARMv7
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Android NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip -d ~/
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build via CMake
        run: |
          cmake -B build_android_armv7 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-android-armv7.cmake \
            -DNK_BUILD_SHARED=ON
          cmake --build build_android_armv7

      - name: Verify Binary
        run: |
          file build_android_armv7/libnumkong.so
          file build_android_armv7/libnumkong.so | grep -q "ELF 32-bit.*ARM"

      - name: Install Rust Toolchain
        uses: moonrepo/setup-rust@v1

      - name: Install cargo-ndk and Target
        run: |
          cargo install cargo-ndk
          rustup target add armv7-linux-androideabi

      - name: Build via Cargo
        run: cargo ndk -t armeabi-v7a build --release

  # 32-bit ARM Linux — validates the same AArch32 code paths as Android ARMv7
  # but with the GNU toolchain instead of the NDK's Clang.
  test_armv7_linux:
    name: Test ARMv7 Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf

      - name: Build via CMake
        run: |
          cmake -B build_armv7 \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc-14 \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++-14 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DNK_BUILD_SHARED=ON
          cmake --build build_armv7

      - name: Verify Binary
        run: |
          file build_armv7/libnumkong.so
          file build_armv7/libnumkong.so | grep -q "ELF 32-bit.*ARM"

      - name: Install Rust Toolchain
        uses: moonrepo/setup-rust@v1

      - name: Install Target
        run: rustup target add armv7-unknown-linux-gnueabihf

      - name: Build via Cargo
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc-14
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc-14
        run: cargo build --target armv7-unknown-linux-gnueabihf --release

  test_riscv_llvm23:
    name: Test RISC-V LLVM 23 (QEMU)
    runs-on: ubuntu-24.04
    # Noble's qemu-user is 8.2, which predates `Zvbb`/`Zvfh` in `riscv_hwprobe`,
    # so RVV would never dispatch and this job would pass on serial fallbacks.
    # Trixie has qemu 10, and apt.llvm.org publishes Clang 23 for trixie.
    container: debian:trixie
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # Second entry is what `release-c.yml` ships; CI must run what we publish.
        march: [rv64gcv, rv64gcv_zvfh_zvfbfwma_zvbb]

    steps:
      # `git` must precede `actions/checkout`, or it falls back to the tarball API.
      - name: Install Dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gnupg \
            cmake make qemu-user gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libc6-dev-riscv64-cross
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/trixie/ llvm-toolchain-trixie-23 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y clang-23 lld-23 llvm-23

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (${{ matrix.march }})
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build_riscv \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-riscv64-llvm.cmake \
            -DLLVM_ROOT=/usr/lib/llvm-23 \
            -DRISCV_MARCH=${{ matrix.march }} \
            -DNK_BUILD_TEST=ON \
            -DNK_BUILD_SHARED=ON

      - name: Build
        run: cmake --build build_riscv --parallel

      # `-V` so the ISA table lands in the log and shows which kernels dispatched.
      - name: Test
        run: ctest --test-dir build_riscv -V --no-tests=error
        env:
          NK_IN_QEMU: 1
          NK_BUDGET_SECS: 0.1

  test_qemu_cross:
    name: Test ${{ matrix.name }} (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # No AArch64 leg: Debian's GCC 14 cross accepts `+sme` but its libgcc has no
          # `__arm_tpidr2_save`, so the SME kernels compile and then fail to link.
          - name: LoongArch
            arch: loongarch64
            prefix: LOONGARCH
            triple: loongarch64-linux-gnu
          - name: Power
            arch: ppc64le
            prefix: PPC
            triple: powerpc64le-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qemu-user \
            gcc-14-${{ matrix.triple }} g++-14-${{ matrix.triple }}

      # The toolchain file knows the processor, the emulator and the loader prefix; only the
      # Debian compiler suffix has to be supplied here.
      - name: Configure
        run: |
          cmake -B build_cross \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-${{ matrix.arch }}-gnu.cmake \
            -D${{ matrix.prefix }}_COMPILER_SUFFIX=-14 \
            -DNK_BUILD_TEST=ON \
            -DNK_BUILD_SHARED=ON

      - name: Build
        run: cmake --build build_cross --parallel

      - name: Test
        run: ctest --test-dir build_cross --output-on-failure --no-tests=error
        env:
          NK_IN_QEMU: 1
          NK_BUDGET_SECS: 0.1

  test_x86_sde:
    name: Test x86 (Intel SDE)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      # Intel rotates the numeric mirror ID per release and retires the old ones,
      # so the download URL cannot be hardcoded. Exports `SDE_PATH`.
      - name: Set Up Intel SDE
        uses: petarpetrovt/setup-sde@v6.0
        with:
          sdeVersion: 10.8.0

      - name: Build with All x86 ISAs
        run: |
          cmake -B build_sde \
            -DCMAKE_BUILD_TYPE=Release \
            -DNK_BUILD_TEST=ON
          cmake --build build_sde --config Release --parallel

      - name: Test Under Granite Rapids Emulation
        run: "$SDE_PATH/sde64 -gnr -- build_sde/nk_test"
        env:
          NK_BUDGET_SECS: 0
