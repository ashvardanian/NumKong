name: Test C

on:
  pull_request:
    branches: ["main", "main-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_c:
    name: Test C on Linux
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Machine Specs
        shell: bash
        run: |
          echo "::group::Machine Information"
          uname -a || true
          cat /proc/cpuinfo 2>/dev/null | head -30 || sysctl -a machdep.cpu 2>/dev/null | head -30 || wmic cpu get Name,NumberOfCores,MaxClockSpeed 2>/dev/null || true
          free -h 2>/dev/null || vm_stat 2>/dev/null || systeminfo 2>/dev/null | head -20 || true
          echo "::endgroup::"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-14 g++-14 libjemalloc-dev libomp-dev libopenblas-dev

      - name: Build Locally
        run: |
          cmake --preset release -D NUMKONG_COMPARE_TO_BLAS=ON -D CMAKE_C_COMPILER=gcc-14 -D CMAKE_CXX_COMPILER=g++-14
          cmake --build --preset release

      # Runs the static and the shared-library suites
      - name: Test
        run: ctest --preset release

  # Release compiles `nk_assert_` out, so only this job checks the library's invariants.
  test_c_debug:
    name: Test Debug build on Ubuntu
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Machine Specs
        shell: bash
        run: |
          echo "::group::Machine Information"
          uname -a || true
          cat /proc/cpuinfo 2>/dev/null | head -30 || sysctl -a machdep.cpu 2>/dev/null | head -30 || wmic cpu get Name,NumberOfCores,MaxClockSpeed 2>/dev/null || true
          free -h 2>/dev/null || vm_stat 2>/dev/null || systeminfo 2>/dev/null | head -20 || true
          echo "::endgroup::"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-14 g++-14 libjemalloc-dev libomp-dev libopenblas-dev

      - name: Build Locally
        run: |
          cmake --preset debug -D CMAKE_C_COMPILER=gcc-14 -D CMAKE_CXX_COMPILER=g++-14
          cmake --build --preset debug --target numkong_test

      # The `debug` test preset pins small shapes: at the default ones, unoptimized kernels under ASan take hours.
      - name: Test
        run: ctest --preset debug -R '^numkong_test$'

  test_macos_homebrew_llvm:
    name: Test C on macOS with Homebrew LLVM
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Homebrew LLVM
        run: brew install llvm

      # Record everything the runner CPU advertises so a future probe
      # mismatch can be diagnosed without repro-locally-only guesswork.
      - name: Print Machine Specs
        run: sysctl hw.optional.arm || true

      - name: Build
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake --preset release -D NUMKONG_BUILD_BENCH=OFF \
            -D CMAKE_C_COMPILER="${LLVM_PREFIX}/bin/clang" -D CMAKE_CXX_COMPILER="${LLVM_PREFIX}/bin/clang++"
          cmake --build --preset release

      # Smoke test under lldb with an impossible NUMKONG_FILTER so no kernels run —
      # only `nk_capabilities_available()` / `nk_configure_thread()` and the suite's
      # argv/env setup. If a SIGILL fires during probing (as on Apple M1 with
      # Homebrew LLVM), lldb captures the backtrace, faulting PC symbol, and
      # 8 instructions around it so the offender is visible in the job log.
      - name: Smoke Test under lldb
        run: |
          DYLD_LIBRARY_PATH=build_release \
            lldb --batch \
              -o run \
              -k 'bt all' \
              -k 'image lookup -a {frame.pc}' \
              -k 'disassemble -c 8 -s {frame.pc}' \
              -k 'quit' \
              -- build_release/numkong_test
        env:
          NUMKONG_FILTER: __nk_impossible_filter__
          NUMKONG_BUDGET_SECS: 0.05

      - name: Test
        run: ctest --preset release

  test_windows:
    name: Test C on Windows
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Machine Specs
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors,Description,Architecture
          Get-ComputerInfo | Format-List CsProcessors,OsArchitecture,WindowsVersion

      - name: Set Up MSVC
        uses: microsoft/setup-msbuild@v3

      # Newest CMake, so it knows whichever Visual Studio the image ships.
      - name: Set Up CMake
        uses: lukka/get-cmake@latest

      # No `-G`: let CMake pick the installed Visual Studio.
      - name: Build
        run: |
          cmake -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DNUMKONG_BUILD_TEST=ON `
            -DNUMKONG_BUILD_BENCH=OFF `
            -B build_release
          cmake --build build_release --config Release

      - name: Test
        run: build_release\Release\numkong_test.exe
        env:
          NUMKONG_BUDGET_SECS: 0.2

      - name: Build Shared Library Test
        run: |
          cmake -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DNUMKONG_BUILD_SHARED=ON `
            -DNUMKONG_BUILD_TEST=ON `
            -B build_shared
          cmake --build build_shared --config Release --target numkong_shared_test

      - name: Test Shared Library
        shell: cmd # PowerShell normalizes structured-exception exit codes to 1; cmd preserves the real code
        run: build_shared\Release\numkong_shared_test.exe
        env:
          NUMKONG_BUDGET_SECS: 0.2

  test_android:
    name: Test C for Android ARM64
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Machine Specs
        shell: bash
        run: |
          echo "::group::Machine Information"
          uname -a || true
          cat /proc/cpuinfo 2>/dev/null | head -30 || true
          free -h 2>/dev/null || true
          echo "::endgroup::"

      - name: Download Android NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip -d ~/
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build via CMake
        run: |
          cmake --preset android_arm64
          cmake --build --preset android_arm64

      - name: Verify Binary
        run: |
          file build_android_arm64/libnumkong.so
          file build_android_arm64/libnumkong.so | grep -q "ELF 64-bit.*aarch64"
          readelf -d build_android_arm64/libnumkong.so | head -20

      - name: Install Rust Toolchain
        uses: moonrepo/setup-rust@v1

      - name: Install cargo-ndk and Target
        run: |
          cargo install cargo-ndk
          rustup target add aarch64-linux-android

      - name: Build via Cargo
        run: cargo ndk -t arm64-v8a build --release

  # 32-bit ARM Android — catches AArch64-only intrinsics leaking into
  # NEON code paths, like float64x2_t which doesn't exist on ARMv7.
  test_android_armv7:
    name: Test C for Android ARMv7
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Android NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip -d ~/
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build via CMake
        run: |
          cmake --preset android_armv7
          cmake --build --preset android_armv7

      - name: Verify Binary
        run: |
          file build_android_armv7/libnumkong.so
          file build_android_armv7/libnumkong.so | grep -q "ELF 32-bit.*ARM"

      - name: Install Rust Toolchain
        uses: moonrepo/setup-rust@v1

      - name: Install cargo-ndk and Target
        run: |
          cargo install cargo-ndk
          rustup target add armv7-linux-androideabi

      - name: Build via Cargo
        run: cargo ndk -t armeabi-v7a build --release

  # 32-bit ARM Linux — validates the same AArch32 code paths as Android ARMv7
  # but with the GNU toolchain instead of the NDK's Clang.
  test_armv7_linux:
    name: Test C for Linux ARMv7
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-arm-linux-gnueabihf g++-14-arm-linux-gnueabihf

      - name: Build via CMake
        run: |
          cmake --preset linux_armv7 -D CMAKE_C_COMPILER=arm-linux-gnueabihf-gcc-14 -D CMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++-14
          cmake --build --preset linux_armv7

      - name: Verify Binary
        run: |
          file build_linux_armv7/libnumkong.so
          file build_linux_armv7/libnumkong.so | grep -q "ELF 32-bit.*ARM"

      - name: Install Rust Toolchain
        uses: moonrepo/setup-rust@v1

      - name: Install Target
        run: rustup target add armv7-unknown-linux-gnueabihf

      - name: Build via Cargo
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc-14
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc-14
        run: cargo build --target armv7-unknown-linux-gnueabihf --release

  test_riscv_llvm23:
    name: Test RISC-V LLVM 23 under QEMU, ${{ matrix.march }}
    runs-on: ubuntu-26.04
    # Noble's qemu-user is 8.2, which predates `Zvbb`/`Zvfh` in `riscv_hwprobe`,
    # so RVV would never dispatch and this job would pass on serial fallbacks.
    # Trixie has qemu 10, and apt.llvm.org publishes Clang 23 for trixie.
    container: debian:trixie
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # Second entry is what `release-c.yml` ships; CI must run what we publish.
        march: [rv64gcv, rv64gcv_zvfh_zvfbfwma_zvbb]

    steps:
      # `git` must precede `actions/checkout`, or it falls back to the tarball API.
      - name: Install Dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gnupg \
            cmake ninja-build qemu-user gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libc6-dev-riscv64-cross
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/trixie/ llvm-toolchain-trixie-23 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y clang-23 lld-23 llvm-23

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure for ${{ matrix.march }}
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux_riscv64_llvm -D LLVM_ROOT=/usr/lib/llvm-23 -D RISCV_MARCH=${{ matrix.march }}

      - name: Build
        run: cmake --build --preset linux_riscv64_llvm

      # `-V` so the ISA table lands in the log and shows which kernels dispatched.
      - name: Test
        run: ctest --preset linux_riscv64_llvm -V

  test_qemu_cross:
    name: Test C under QEMU, ${{ matrix.name }}
    runs-on: ubuntu-26.04
    # Noble's GCC 14 cross ICEs folding SVE intrinsics under LTO; Trixie's builds the same tree.
    container: debian:trixie
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # `sve-max-vq` is VL/128; the NEON leg needs `sve=off` or dispatch prefers SVE2.
          - name: AArch64 NEON
            arch: aarch64
            prefix: AARCH64
            triple: aarch64-linux-gnu
            qemu_cpu: max,sve=off
          - name: AArch64 SVE 128
            arch: aarch64
            prefix: AARCH64
            triple: aarch64-linux-gnu
            qemu_cpu: max,sve-max-vq=1
          - name: AArch64 SVE 256
            arch: aarch64
            prefix: AARCH64
            triple: aarch64-linux-gnu
            qemu_cpu: max,sve-max-vq=2
          - name: AArch64 SVE 512
            arch: aarch64
            prefix: AARCH64
            triple: aarch64-linux-gnu
            qemu_cpu: max,sve-max-vq=4
          - name: LoongArch
            arch: loongarch64
            prefix: LOONGARCH
            triple: loongarch64-linux-gnu
            qemu_cpu: max
          - name: Power
            arch: ppc64le
            prefix: PPC
            triple: powerpc64le-linux-gnu
            qemu_cpu: power10

    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build g++ qemu-user \
            gcc-14-${{ matrix.triple }} g++-14-${{ matrix.triple }}

      - name: Checkout
        uses: actions/checkout@v7

      # The toolchain file knows the emulator and loader prefix; only these two vary.
      - name: Configure for ${{ matrix.qemu_cpu }}
        run: |
          cmake --preset linux_${{ matrix.arch }} \
            -D ${{ matrix.prefix }}_COMPILER_SUFFIX=-14 -D ${{ matrix.prefix }}_QEMU_CPU=${{ matrix.qemu_cpu }}

      - name: Build
        run: cmake --build --preset linux_${{ matrix.arch }}

      # `-V` so the ISA table lands in the log and shows which kernels dispatched.
      - name: Test
        run: ctest --preset linux_${{ matrix.arch }} -V

  test_x86_sde:
    name: Test x86 under Intel SDE
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Intel rotates the numeric mirror ID per release and retires the old ones,
      # so the download URL cannot be hardcoded. Exports `SDE_PATH`.
      - name: Set Up Intel SDE
        uses: petarpetrovt/setup-sde@v6.0
        with:
          sdeVersion: 10.8.0

      - name: Build with All x86 ISAs
        run: |
          cmake --preset release
          cmake --build --preset release --target numkong_test

      - name: Test Under Granite Rapids Emulation
        run: "$SDE_PATH/sde64 -gnr -- build_release/numkong_test"
        env:
          NUMKONG_BUDGET_SECS: 0
