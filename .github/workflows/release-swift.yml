name: Release Swift

on:
  release:
    types: [published]

permissions:
  contents: read

# The release commit names the Swift artifacts the release carries, which `release.yml` uploads right after
# publishing it. Once they land, this resolves the package as a consumer does, downloading and checking them.
jobs:
  wait_for_artifacts:
    name: Wait for Swift Artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for Swift Artifacts
        uses: nick-fields/retry@v4
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          max_attempts: 30
          retry_wait_seconds: 60
          timeout_minutes: 5
          command: |
            assets=$(gh release view "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
            grep -qx CNumKong.xcframework.zip <<< "$assets" && grep -qx CNumKong.artifactbundle.zip <<< "$assets"

  validate_macos:
    name: Validate Swift Package on macOS
    needs: wait_for_artifacts
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Test
        run: swift test --filter Test

  validate_linux:
    name: Validate Swift Package on Linux ${{ matrix.arch }}
    needs: wait_for_artifacts
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: swift:6.4
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Test
        run: swift test --filter Test
