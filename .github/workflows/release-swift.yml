name: Release Swift

on:
  release:
    types: [published]

permissions:
  contents: read

# Swift packages are consumed as source via git tags — no artifact upload needed.
# This workflow validates that the tagged commit builds and passes tests on both
# platforms, so Swift Package Index (and consumers) see a healthy tag.
jobs:
  validate_macos:
    name: Validate Swift Package on macOS
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Test
        run: swift test --filter Test

  validate_linux:
    name: Validate Swift Package on Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: swift:6.4
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "main"
      - name: Test
        run: swift test --filter Test
