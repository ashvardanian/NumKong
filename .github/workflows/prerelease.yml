name: Pre-Release

on:
  pull_request:
    branches: ["main", "main-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            package.json:"(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            javascript/@numkong-linux-x64/package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            javascript/@numkong-linux-arm64/package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            javascript/@numkong-darwin-x64/package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            javascript/@numkong-darwin-arm64/package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            javascript/@numkong-win32-x64/package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            javascript/@numkong-win32-arm64/package.json:"version": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            Package.swift:releases/download/v(\d+\.\d+\.\d+(?:-rc\.\d+)?)
            package.json:@numkong/darwin-arm64": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            package.json:@numkong/darwin-x64": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            package.json:@numkong/linux-arm64": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            package.json:@numkong/linux-x64": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            package.json:@numkong/win32-arm64": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            package.json:@numkong/win32-x64": "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
          update-major-version-in: |
            c/numkong/types.h:^#define NUMKONG_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            c/numkong/types.h:^#define NUMKONG_VERSION_MINOR (\d+)
          update-patch-version-in: |
            c/numkong/types.h:^#define NUMKONG_VERSION_PATCH (\d+)
          dry-run: "true"

  wheels:
    name: Build Python Wheels
    uses: ./.github/workflows/build-wheels.yml
    secrets: inherit

  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Install NumKong from the Checkout
        run: pip install .
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W
