name: Pre-Release

on:
  pull_request:
    branches: ["main", "main-dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: 1

jobs:
  wheels:
    name: Build Python Wheels
    uses: ./.github/workflows/_wheels.yml
    secrets: inherit
