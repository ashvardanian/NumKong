name: Test JavaScript

on:
  workflow_call:

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.9
  WASI_SDK_VERSION: "34"
  WASMER_VERSION: v7.5.0
  WASMTIME_VERSION: v50.0.1
  # wasi-threads runs on Wasmtime 46 and older, so the threaded rows take the 36 LTS line.
  WASMTIME_THREADS_VERSION: v36.0.20

jobs:
  test_nodejs:
    name: Test Node.js
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Print Machine Specs
        run: |
          uname -a
          lscpu
          free -h

      - name: Update Compilers
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: |
            sudo apt update
            sudo apt install -y cmake build-essential

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and Test
        run: |
          npm install --ignore-scripts --omit=optional
          npm run prebuild
          npm run build-js
          npm test

  # One row per toolchain file, SIMD tier and runtime. A module carries one tier, so the strict and the
  # relaxed rows are separate builds, and the wasm32 Emscripten rows hand their modules to the browser job.
  # Node 22 stays the Emscripten floor, but its WASI host crashes in `dots_symmetric_f64_serial`.
  test_wasm:
    name: Test on WebAssembly ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wasm32-emscripten serial under Node
            sdk: emscripten
            preset: wasm32_emscripten
            simd: serial
            runtime: emscripten
            node: 22
          - name: wasm32-emscripten v128 under Node
            sdk: emscripten
            preset: wasm32_emscripten
            simd: v128
            runtime: emscripten
            node: 22
          - name: wasm32-emscripten v128relaxed under Node
            sdk: emscripten
            preset: wasm32_emscripten
            simd: v128relaxed
            runtime: emscripten
            node: 22
          - name: wasm64-emscripten v128relaxed under Node
            sdk: emscripten
            preset: wasm64_emscripten
            simd: v128relaxed
            runtime: emscripten64
            node: 24
          - name: wasm32-wasi v128 under Node
            sdk: wasi
            preset: wasm32_wasi
            simd: v128
            runtime: wasi-node
            node: 24
          - name: wasm32-wasi v128relaxed under Node
            sdk: wasi
            preset: wasm32_wasi
            simd: v128relaxed
            runtime: wasi-node
            node: 24
          - name: wasm32-wasi v128 under Wasmtime and Wasmer
            sdk: wasi
            preset: wasm32_wasi
            simd: v128
            runtime: standalone
            node: 22
          - name: wasm32-wasi v128relaxed under Wasmtime and Wasmer
            sdk: wasi
            preset: wasm32_wasi
            simd: v128relaxed
            runtime: standalone
            node: 22
          - name: wasm32-wasi-threads v128relaxed under Wasmtime and Wasmer
            sdk: wasi
            preset: wasm32_wasi_threads
            simd: v128relaxed
            runtime: standalone-threads
            node: 22

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Print Machine Specs
        run: |
          uname -a
          lscpu
          free -h

      - name: Install Emscripten
        if: matrix.sdk == 'emscripten'
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 180
          command: |
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            (cd ~/emsdk && ./emsdk install "$EMSCRIPTEN_VERSION" && ./emsdk activate "$EMSCRIPTEN_VERSION")

      - name: Install WASI-SDK
        if: matrix.sdk == 'wasi'
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 180
          command: |
            wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
            tar xzf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz -C ~
            mv ~/wasi-sdk-* ~/wasi-sdk

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # CTest runs the WASI tests through the Wasmtime the toolchain finds at configure time.
      - name: Install Wasmtime
        if: matrix.runtime == 'standalone' || matrix.runtime == 'standalone-threads'
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version "${{ matrix.runtime == 'standalone-threads' && env.WASMTIME_THREADS_VERSION || env.WASMTIME_VERSION }}"
            "$HOME/.wasmtime/bin/wasmtime" --version

      # `test/wasm.mjs` and the browser pages load the modules from each preset's build directory by name.
      - name: Build Emscripten Module
        if: matrix.sdk == 'emscripten'
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --preset ${{ matrix.preset }} -D NUMKONG_MARCH=${{ matrix.simd }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Upload Emscripten Module
        if: matrix.runtime == 'emscripten'
        uses: actions/upload-artifact@v7
        with:
          name: wasm-module-wasm32-${{ matrix.simd }}
          path: |
            build_${{ matrix.preset }}/numkong-wasm32-${{ matrix.simd }}.js
            build_${{ matrix.preset }}/numkong-wasm32-${{ matrix.simd }}.wasm
          if-no-files-found: error
          retention-days: 1

      - name: Build WASI Module
        if: matrix.sdk == 'wasi'
        run: |
          cmake --preset ${{ matrix.preset }} -D NUMKONG_MARCH=${{ matrix.simd }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Build JavaScript Bindings
        if: matrix.runtime != 'standalone' && matrix.runtime != 'standalone-threads'
        run: |
          npm install --ignore-scripts
          npm run build-js

      - name: Test on Node.js
        if: matrix.runtime == 'emscripten' || matrix.runtime == 'emscripten64' || matrix.runtime == 'wasi-node'
        run: NUMKONG_RUNTIME=${{ matrix.runtime }} node --test test/wasm.mjs
        env:
          NUMKONG_TIME_LIMIT: 100ms

      - name: Test on Wasmtime
        if: matrix.runtime == 'standalone' || matrix.runtime == 'standalone-threads'
        run: ctest --preset ${{ matrix.preset }}

      # Install the latest released Wasmer (which now ships relaxed-SIMD). Building
      # `--git main` broke: upstream's main pulls a private SSH submodule
      # (git@github.com:wasmerio/quickjs.git) that fails to authenticate in CI.
      - name: Install Wasmer
        if: matrix.runtime == 'standalone' || matrix.runtime == 'standalone-threads'
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: curl https://get.wasmer.io -sSfL | sh -s "$WASMER_VERSION"

      # The strict module runs without the relaxed switch, which is the point of shipping it.
      - name: Test on Wasmer
        if: matrix.runtime == 'standalone' || matrix.runtime == 'standalone-threads'
        run: |
          export PATH="$HOME/.wasmer/bin:$PATH"
          wasmer run --enable-simd ${{ matrix.simd == 'v128relaxed' && '--enable-relaxed-simd' || '' }} \
            ${{ matrix.runtime == 'standalone-threads' && '--enable-threads' || '' }} \
            --forward-host-env ./build_${{ matrix.preset }}/numkong_cpu_test.wasm
        env:
          NUMKONG_TIME_LIMIT: 100ms

  # The wasm32 tiers meet in `wasm/`, as published; the loader picks what each browser validates.
  test_browsers:
    name: Test on WebAssembly wasm32-emscripten under Browsers
    needs: test_wasm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Print Machine Specs
        run: |
          uname -a
          lscpu
          free -h

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Emscripten Modules
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-module-wasm32-*
          path: wasm
          merge-multiple: true

      - name: Build JavaScript Bindings and Browser Bundle
        run: |
          npm install --ignore-scripts
          npm run build-js
          npm run build-browser

      - name: Install Playwright
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 180
          command: npx playwright install --with-deps chromium webkit

      - name: Test in Browsers
        run: npx playwright test --config test/playwright.config.ts

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  test_deno:
    name: Test Deno
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Print Machine Specs
        run: |
          uname -a
          lscpu
          free -h

      - name: Update Compilers
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: |
            sudo apt update
            sudo apt install -y cmake build-essential

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and Test with Node
        run: |
          npm install --ignore-scripts --omit=optional
          npm run prebuild
          npm run build-js
          npm test

      - name: Set Up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test with Deno
        run: deno test -A --no-check test/main.mjs

  test_bun:
    name: Test Bun
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Print Machine Specs
        run: |
          uname -a
          lscpu
          free -h

      - name: Update Compilers
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: |
            sudo apt update
            sudo apt install -y cmake build-essential

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build Prebuilds and JS
        run: |
          npm install --ignore-scripts --omit=optional
          npm run prebuild
          npm run build-js

      - name: Test with Node
        run: npm test

      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2

      - name: Test with Bun
        run: bun test ./test/main.mjs
