name: Release JavaScript

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.9

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  build_native:
    name: Build Native Package for ${{ matrix.platform }}
    needs: hooks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-26.04
            cc: gcc-14
            cxx: g++-14
            script: prebuild
          - platform: linux-arm64
            os: ubuntu-26.04
            cc: aarch64-linux-gnu-gcc-14
            cxx: aarch64-linux-gnu-g++-14
            script: prebuild-arm64
          - platform: darwin-arm64
            os: macos-26
            cc: clang
            cxx: clang++
            script: prebuild
          - platform: darwin-x64
            os: macos-26
            cc: clang
            cxx: clang++
            script: prebuild-x64
          - platform: win32-x64
            os: windows-2025
            cc: cl.exe
            cxx: cl.exe
            script: prebuild
          - platform: win32-arm64
            os: windows-2025
            cc: cl.exe
            cxx: cl.exe
            script: prebuild-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install System Dependencies on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential
          sudo apt install -y gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Set Up MSVC ARM64 Cross-Compiler
        if: matrix.platform == 'win32-arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvars`" amd64_arm64 >NUL 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]; $value = $matches[2]
              if ([System.Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
              }
            }
          }

      - name: Install Node.js Dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: npm install --ignore-scripts

      # CMake reads the toolchain file from the environment, which picks the target's probes and ABI floor.
      - name: Point CMake at the AArch64 Cross Toolchain
        if: matrix.platform == 'linux-arm64'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchain-aarch64-gnu.cmake" >> "$GITHUB_ENV"
          echo "AARCH64_COMPILER_SUFFIX=-14" >> "$GITHUB_ENV"

      # Stages the addon into its `javascript/@numkong-<platform>` package.
      - name: Build Native Module
        run: npm run ${{ matrix.script }}

      - name: Upload Platform Package
        uses: actions/upload-artifact@v7
        with:
          name: numkong-${{ matrix.platform }}
          path: javascript/@numkong-${{ matrix.platform }}/
          retention-days: 1

  # One module per tier and width; the loader picks a wasm32 tier by what the engine validates.
  build_wasm_module:
    name: Build WASM Module ${{ matrix.width }} ${{ matrix.simd }}
    needs: hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: wasm32
            simd: serial
          - width: wasm32
            simd: v128
          - width: wasm32
            simd: v128relaxed
          - width: wasm64
            simd: v128relaxed
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Emscripten
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 180
          command: |
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            (cd ~/emsdk && ./emsdk install "$EMSCRIPTEN_VERSION" && ./emsdk activate "$EMSCRIPTEN_VERSION")
      - name: Build WASM
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --preset ${{ matrix.width }}_emscripten -B build_wasm -D NUMKONG_MARCH=${{ matrix.simd }}
          cmake --build build_wasm
      - name: Upload WASM Module
        uses: actions/upload-artifact@v7
        with:
          name: wasm-module-${{ matrix.width }}-${{ matrix.simd }}
          path: |
            build_wasm/numkong-${{ matrix.width }}-${{ matrix.simd }}.js
            build_wasm/numkong-${{ matrix.width }}-${{ matrix.simd }}.wasm
          if-no-files-found: error
          retention-days: 1

  build_wasm:
    name: Build WASM Bundle
    needs: build_wasm_module
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Download WASM Modules
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-module-*
          path: wasm
          merge-multiple: true
      # Both entries join the four modules, reaching each through its package subpath.
      - name: Build JavaScript and Assemble WASM Bundle
        run: |
          npm install --ignore-scripts
          npm run build-js
          npm run build-browser
      - name: Upload WASM Bundle
        uses: actions/upload-artifact@v7
        with:
          name: wasm-bundle
          path: wasm
          retention-days: 1
          overwrite: true

  publish_javascript_platform:
    name: Publish JavaScript Platform Package for ${{ matrix.platform }} to npm
    needs: build_native
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@numkong/${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64, win32-arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Download Platform Artifact
        id: download
        uses: actions/download-artifact@v8
        with:
          name: numkong-${{ matrix.platform }}
          path: javascript/@numkong-${{ matrix.platform }}/
        continue-on-error: true
      - name: Publish @numkong/${{ matrix.platform }}
        if: steps.download.outcome == 'success'
        working-directory: javascript/@numkong-${{ matrix.platform }}
        run: npm publish --provenance --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}

  publish_javascript:
    name: Publish JavaScript to npm
    needs: [publish_javascript_platform, build_wasm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/numkong
    permissions:
      contents: read
      id-token: write
    steps:
      # npm versions are immutable: shipping without the advertised
      # `numkong/wasm` subpath would strand this version permanently.
      - name: Require WASM Bundle
        if: needs.build_wasm.result != 'success'
        run: |
          echo "::error title=WASM bundle missing::build_wasm result is '${{ needs.build_wasm.result }}'. The main npm package cannot ship without wasm/, which its exports map advertises. Re-run build_wasm, then re-run this workflow."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download WASM Bundle
        uses: actions/download-artifact@v8
        with:
          name: wasm-bundle
          path: wasm

      - name: Install Node.js Dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: npm install --ignore-scripts --omit=optional

      - name: Install CMake
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential

      - name: Build Native Addon
        run: npm run prebuild

      - name: Build JavaScript from TypeScript
        run: npm run build-js

      - name: Run Tests
        run: npm run test

      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
