name: Test Swift

on:
  pull_request:
    branches: ["main", "main-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `actions: read` lets the Android job, which runs in another repository's workflow, download this run's artifacts.
permissions:
  actions: read
  contents: read

# Every job links the zipped XCFramework or artifact bundle a release would ship, built by CMake from this commit.
jobs:
  build_swift_artifacts:
    name: Build Swift Artifacts
    uses: ./.github/workflows/_swift.yml

  test_linux:
    name: Test Swift on Linux ${{ matrix.arch }}
    needs: build_swift_artifacts
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: swift:6.4
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      NUMKONG_SWIFT_ARTIFACT: CNumKong.artifactbundle.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifact Bundle
        uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle
      - name: Print Machine Specs
        shell: bash
        run: |
          echo "::group::Machine Information"
          uname -a || true
          cat /proc/cpuinfo 2>/dev/null | head -30 || true
          free -h 2>/dev/null || true
          echo "::endgroup::"
      - name: Test Swift
        run: swift test --filter Test

  test_macos:
    name: Test Swift on macOS ${{ matrix.arch }}
    needs: build_swift_artifacts
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      NUMKONG_SWIFT_ARTIFACT: CNumKong.xcframework.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download XCFramework
        uses: actions/download-artifact@v8
        with:
          name: swift-xcframework
      - name: Print Machine Specs
        shell: bash
        run: |
          echo "::group::Machine Information"
          uname -a || true
          sysctl -a machdep.cpu 2>/dev/null | head -30 || true
          swift --version
          echo "::endgroup::"
      # The `x86_64` destination runs the Intel build under Rosetta, as no Intel image ships Xcode 27
      - name: Test Swift
        run: xcodebuild test -scheme NumKong -only-testing Test -destination 'platform=macOS,arch=${{ matrix.arch }}'

  test_apple_simulators:
    name: Test Swift on ${{ matrix.platform }} Simulator
    needs: build_swift_artifacts
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    env:
      NUMKONG_SWIFT_ARTIFACT: CNumKong.xcframework.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download XCFramework
        uses: actions/download-artifact@v8
        with:
          name: swift-xcframework
      - name: Build for Simulator
        run: xcodebuild build-for-testing -scheme NumKong -destination 'generic/platform=${{ matrix.platform }} Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Test on iPhone Simulator
        if: matrix.platform == 'iOS'
        run: |
          xcodebuild test -scheme NumKong -only-testing Test \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' CODE_SIGNING_ALLOWED=NO

  test_windows:
    name: Test Swift on Windows ${{ matrix.arch }}
    needs: build_swift_artifacts
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      NUMKONG_SWIFT_ARTIFACT: CNumKong.artifactbundle.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifact Bundle
        uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle
      - name: Set Up Swift
        uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
          build_arch: ${{ matrix.arch }}
      - name: Test Swift
        run: swift test --filter Test

  # Build-only: the emulator checks run `./*-test-runner`, which executes just the first of our two runners
  build_android:
    name: Build Swift for Android
    needs: build_swift_artifacts
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@fa1e46cf0f07ffde2de131e9ed5bd66a488c289c # main
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_android_sdk_build: true
      needs_token: true
      linux_env_vars: NUMKONG_SWIFT_ARTIFACT=CNumKong.artifactbundle.zip
      android_sdk_pre_build_command: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name swift-artifactbundle
      android_sdk_build_command: swift build --build-tests
      android_sdk_versions: '["6.4"]'

  test_wasm:
    name: Test Swift on WebAssembly WASI
    needs: build_swift_artifacts
    runs-on: ubuntu-24.04
    container: swift:6.4
    env:
      NUMKONG_SWIFT_ARTIFACT: CNumKong.artifactbundle.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifact Bundle
        uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle
      - name: Install Swift SDK for WebAssembly and Wasmtime
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
          apt-get update && apt-get install -y curl xz-utils
          curl -fsSL https://wasmtime.dev/install.sh | bash
      - name: Build Library and Tests
        run: swift build --build-tests --swift-sdk swift-6.4.0-RELEASE_wasm
      - name: Test under Wasmtime
        run: ~/.wasmtime/bin/wasmtime run --dir / .build/debug/Test-test-runner.wasm --testing-library swift-testing
