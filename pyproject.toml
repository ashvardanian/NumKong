# This file configures wheels compilation for `cibuildwheel` for NumKong CPython bindings.
# On a good day it will produce:
# - `manylinux` and `musllinux` vectorized wheels for Linux on x86_64, aarch64, riscv64;
# - `manylinux` and `musllinux` wheels for Linux on i686, ppc64le, s390x;
# - `macos` wheels for x86_64, arm64;
# - `windows` wheels for AMD64, ARM64;
# - `pyodide` wheels for wasm32.
# * for Python 3.10 to 3.14, plus free-threading 3.14.
# * running thousands of fuzzy tests on each wheel.

[build-system]
build-backend = "scikit_build_core.build"
requires = ["hatch-fancy-pypi-readme>=22.3", "scikit-build-core>=0.10"]

[project]
authors = [{ email = "1983160+ashvardanian@users.noreply.github.com", name = "Ash Vardanian" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
description = "Portable mixed-precision math, linear-algebra, & retrieval library with 2000+ SIMD kernels for x86, Arm, RISC-V, LoongArch, Power, & WebAssembly"
dynamic = ["readme", "version"]
license = { text = "Apache-2.0" }
name = "numkong"
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/ashvardanian/NumKong"

[tool.cibuildwheel]
# Every CI job narrows this with `CIBW_ARCHS`; the full set stays for local runs.
# https://cibuildwheel.readthedocs.io/en/stable/options/#archs
archs = ["all"]
build-verbosity = 0
# https://cibuildwheel.readthedocs.io/en/stable/options/#enable
enable = []  # no PyPy and no free-threading 3.13; 3.14t is on by default
# Forwarded from the job environment; `NUMKONG_IN_QEMU` shrinks the fuzzing dimensions on emulated runners.
environment-pass = [
    "NUMKONG_CURVED_DIMS",
    "NUMKONG_DIMS",
    "NUMKONG_DIMS_DEPTH",
    "NUMKONG_DIMS_HEIGHT",
    "NUMKONG_DIMS_WIDTH",
    "NUMKONG_FILTER",
    "NUMKONG_IN_QEMU",
    "NUMKONG_MAX_COORD_ANGLE",
    "NUMKONG_MESH_POINTS",
    "NUMKONG_REPETITIONS",
    "NUMKONG_SEED",
    "NUMKONG_SPARSE_DIMS",
]
# Lock the glibc floor for the popular architectures. These match cibuildwheel's current defaults,
# so a future default bump moves neither the floor nor the wheel tags without an edit here.
# You can keep track of the most recent images on Quay:
# - for `manylinux`: https://quay.io/search?q=manylinux
# - for `musllinux`: https://quay.io/search?q=musllinux
manylinux-aarch64-image = "manylinux_2_28"
# The riscv64 images `cibuildwheel` pins carry `patchelf` 0.17, which corrupts the extension
# while rewriting its RPATH — the entry point lands below `.text` and the import dies with
# SIGILL. Dated tags keep the glibc 2.39 floor and only move `patchelf` to 0.19; the named
# `manylinux_2_39` resolves back to the broken pin. Upgrading `patchelf` at repair works, uglier.
manylinux-riscv64-image = "quay.io/pypa/manylinux_2_39_riscv64:2026.09.01-1"
manylinux-x86_64-image = "manylinux_2_28"
musllinux-aarch64-image = "musllinux_1_2"
musllinux-riscv64-image = "quay.io/pypa/musllinux_1_2_riscv64:2026.09.01-1"
musllinux-x86_64-image = "musllinux_1_2"
# Alpine's clang 20 can't see RVV intrinsics behind the per-function `target("arch=+v")` the
# kernels use; clang 21 can, so the manylinux leg builds and the musllinux one doesn't.
skip = ["*-musllinux_riscv64"]  # we also don't use any SIMD on: ["*s390x*", "*ppc64le*"]
# The optional oracles may have no precompiled wheels for some platforms, and compiling them
# from source on emulated hardware takes hours, so `--only-binary=:all:` fetches them or skips them.
# For better compatibility, we use (&&) to chain commands instead of (;).
test-command = """
    python -m pip install scipy --only-binary=:all: || (echo "Failed to install SciPy" && exit 0) &&
    python -m pip install ml_dtypes --only-binary=:all: || (echo "Failed to install ml_dtypes" && exit 0) &&
    python -X faulthandler -c "import numkong; print(repr(numkong.cpu_capabilities_enabled()))" &&
    PYTHONMALLOC=debug python -X faulthandler -m pytest -x {project}/test
"""
test-groups = ["test"]
# NumPy publishes no prebuilt wheels for these arches, so the `test` group would compile it on
# emulated hardware. Still BUILD + upload the wheels for them — just skip their test phase.
# (The wheels themselves import and run fine there; only the numeric-parity tests need NumPy.)
test-skip = "*_i686 *_ppc64le *_s390x *_riscv64"

# In Docker containers `os.cpu_count()` reports the host's cores, and that many SIMD compile jobs OOM the container.
[tool.cibuildwheel.environment]
CMAKE_BUILD_PARALLEL_LEVEL = "2"

[tool.cibuildwheel.linux]
# On CentOS we have to use `yum`, and `extras` fails to download on Arm instances.
before-all = [
    "yum update -y --disablerepo=extras --setopt=install_weak_deps=0 && yum install -y --disablerepo=extras glibc-devel wget python3-devel",
]
before-build = ["rm -rf {project}/build_python"]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
# No `before-all`: nothing outside libSystem to link, so `delocate` bundles nothing.
before-build = ["rm -rf {project}/build_python"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

# Pin the platform tag on manylinux_2_28 architectures to avoid verbose
# triple-tagged filenames (e.g., manylinux2014.manylinux_2_17.manylinux_2_28).
[[tool.cibuildwheel.overrides]]
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 --only-plat -w {dest_dir} {wheel}"
select = "*-manylinux*_x86_64"

[[tool.cibuildwheel.overrides]]
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_aarch64 --only-plat -w {dest_dir} {wheel}"
select = "*-manylinux*_aarch64"

# With `musl` builds, we obviously don't need the `glibc` and can't use `yum`.
# This may also be handy for using custom dependencies for different Python versions:
# https://cibuildwheel.readthedocs.io/en/stable/options/#overrides
[[tool.cibuildwheel.overrides]]
before-all = "apk add --update wget python3-dev"
select = "*-musllinux*"

# Windows-based OSes and PowerShell don't support the logical operators
# In PowerShell we could write something like:
# python -m pip install scipy; if ($LASTEXITCODE -ne 0) { echo "Failed to install SciPy... Nothing can stop me, I'm all the way up!" }
# but its safer to use the CMD syntax
[[tool.cibuildwheel.overrides]]
select = "*win*"
test-command = """
    cmd /c "python -m pip install scipy --only-binary=:all: & if errorlevel 1 echo Failed to install SciPy... Nothing can stop me, I'm all the way up! &
    python -m pip install ml_dtypes --only-binary=:all: & if errorlevel 1 echo Failed to install ml_dtypes... Nothing can stop me, I'm all the way up! &
    python -X faulthandler -c "import numkong; print(repr(numkong.cpu_capabilities_enabled()))" &
    set PYTHONMALLOC=debug && python -X faulthandler -m pytest -x {project}/test"
"""

# RISC-V builds: the images' GCC 14 ignores `#pragma GCC target`, which is how the RVV kernels
# opt in, so GCC wheels would carry none. Clang honours its own pragma.
[[tool.cibuildwheel.overrides]]
before-all = "dnf install -y glibc-devel wget python3-devel clang lld"
select = "*-manylinux*_riscv64"
environment.CC = "clang"
environment.CXX = "clang++"
environment.LDFLAGS = "-fuse-ld=lld"
inherit.environment = "append"

# Pyodide / Emscripten WASM builds
# The Pyodide venv creates Python-script entry points (like `pytest`) that can't
# be executed directly as shell commands, so we must use `python -m pytest`.
# Also, `ml_dtypes` has no Pyodide wheel, so we skip it.
[[tool.cibuildwheel.overrides]]
before-build = ["rm -rf {project}/build_python"]
select = "*-pyodide*"
test-command = """
    python -m pip install scipy --only-binary=:all: || (echo "Failed to install SciPy" && exit 0) &&
    python -X faulthandler -c "import numkong; print(repr(numkong.cpu_capabilities_enabled()))" &&
    PYTHONMALLOC=debug python -X faulthandler -m pytest -x {project}/test
"""

[tool.cibuildwheel.windows]
before-build = ["rd /s /q {project}\\build_python || echo Done"]
# cibuildwheel 4 defaults this to `delvewheel`; we link only system DLLs.
repair-wheel-command = ""

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "python/README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.pyright]
extraPaths = ["test"]
stubPath = "python"

[tool.pytest.ini_options]
# `-p no:randomly` keeps `<PROJECT>_SEED` in charge wherever pytest-randomly happens to be installed.
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-p", "no:randomly"]
filterwarnings = ["error"]
minversion = "8.0"
python_files = ["*.py"]
testpaths = ["test"]
xfail_strict = true

# Groups rather than extras, so none of this reaches the published wheel's metadata.
[dependency-groups]
lint = ["ruff>=0.15.8"]
test = ["numpy>=1.21", "pytest>=8", "pytest-repeat>=0.9.4"]
# References the suite compares against when they install, and skips without.
test-oracles = ["ml_dtypes", "scipy"]

[tool.ruff]
extend-exclude = [".cmake-format.py"]  # cmake-format DSL config, not Python source
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B028",  # stacklevel in warnings.warn: not important in test code
    "B905",  # zip-without-strict: not safety-critical in test code
    "E712",  # == True/False: intentional for testing scalar __bool__ return values
    "E731",  # lambda assignments: clearer for one-liner baselines
    "RUF002",  # ambiguous unicode in docstrings: intentional math symbols
    "RUF003",  # ambiguous unicode in comments: intentional math symbols
    "RUF043",  # pytest.raises regex patterns: the metacharacters are intentional
    "SIM105",  # contextlib.suppress: explicit try/except is clearer here
]
select = ["B", "D", "E", "F", "I", "PLC0415", "RUF", "SIM", "TID", "UP", "W"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["numkong"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D", "E501", "F811"]  # tests self-document via names; docstrings not required

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.scikit-build]
build.targets = ["numkong_python"]
build-dir = "build_python/{wheel_tag}"
install.components = ["numkong_python"]
sdist.exclude = ["bench", "build*", "node_modules", "target", "test"]
wheel.packages = ["python/numkong"]

[tool.scikit-build.cmake.define]
NUMKONG_BUILD_PYTHON = "ON"
NUMKONG_BUILD_SHARED = "OFF"
NUMKONG_INSTALL = "OFF"
NUMKONG_TARGET_ARCH = { default = "", env = "NUMKONG_TARGET_ARCH" }

[tool.scikit-build.metadata.readme]
provider = "scikit_build_core.metadata.fancy_pypi_readme"

[tool.scikit-build.metadata.version]
input = "VERSION"
provider = "scikit_build_core.metadata.regex"
regex = "(?P<value>.+)"

# TOML files stay canonical via toml-sort, the way .clang-format keeps C++ canonical.
[tool.tomlsort]
all = true
in_place = true
spaces_before_inline_comment = 2
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
